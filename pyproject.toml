[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fatsecret-mcp"
version = "1.0.0"
description = "MCP server for FatSecret Platform API — search foods, read/manage nutrition diary, saved meals, exercise, weight, favorites, recipes"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.12.4,<2",
    "requests>=2.31,<3",
    "python-dotenv>=1,<2",
    "requests-oauthlib>=2,<3",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9,<1",
]
optional-dependencies = {dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "ruff>=0.5,<1", "mypy>=1.10,<2"]}
authors = [{name = "Anton Berzins", email = "anton@berzins.io"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
keywords = ["mcp", "fatsecret", "nutrition", "diary", "api", "model-context-protocol"]

[project.entry-points]
console_scripts = {fatsecret-mcp = "fatsecret_mcp.server:main"}

[project.urls]
Homepage = "https://github.com/antonberzins/fatsecret-mcp"
Repository = "https://github.com/antonberzins/fatsecret-mcp"
Issues = "https://github.com/antonberzins/fatsecret-mcp/issues"
Documentation = "https://github.com/antonberzins/fatsecret-mcp#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20", "ARG", "PTH", "ERA", "PL", "TRY"]
ignore = ["S101", "S603", "S607", "B008"]
fixable = ["ALL"]
unfixable = ["T20"]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "S603", "S607"]
"src/fatsecret_mcp/auth/oauth1.py" = ["S101", "S603"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
check_untyped_defs = true
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["*Tests"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src/fatsecret_mcp"]
omit = ["tests/*", "*/__pycache__/*"]